<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Catalog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
          <link rel="stylesheet" href="C:\Users\Shaik Thamanna\OneDrive\Documents\bootstrap\style.css">
</head>

<body class="bg-light">

<div class="container py-5">

    <h2 class="text-center mb-4">Book Catalog</h2>

    <div class="row g-4">

        <div class="col-md-3">
            <div class="card p-3 text-center">
                <h4>Book 1</h4>
                <p>Author 1</p>
                <p>₹100</p>

                <button class="btn btn-primary"
                        onclick="addToCart('Book 1', 100)">
                    Add to Cart
                </button>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-3 text-center">
                <h4>Book 2</h4>
                <p>Author 2</p>
                <p>₹200</p>

                <button class="btn btn-primary"
                        onclick="addToCart('Book 2', 200)">
                    Add to Cart
                </button>
            </div>
        </div>

    </div>

    <div class="text-center mt-4">
        <a href="cart.html" class="btn btn-success">
            View Cart
        </a>
    </div>

</div>

<script>

function addToCart(book, price) {

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cart.push({
        name: book,
        price: price
    });

    localStorage.setItem("cart", JSON.stringify(cart));

    alert(book + " added to cart!");
}

</script>

</body>
</html>
