<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="C:\Users\Shaik Thamanna\OneDrive\Documents\bootstrap\style.css">
</head>
<body class="bg-light">
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h2>Registration Form</h2></div>
                <div class="card-body">
                    <form><div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">First Name</label>
                                <input type="text" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Last Name</label>
                                <input type="text" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Mobile No.</label>
                                <input type="tel" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Age</label>
                                <input type="number" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Date of Birth</label>
                                <input type="date" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label d-block">Gender</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input"type="radio"name="gender">
                                    <label class="form-check-label">Male</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input"type="radio"name="gender">
                                    <label class="form-check-label">Female</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input"type="radio"name="gender">
                                    <label class="form-check-label">Other</label>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Hobbies</label>
                                <input type="text" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Country</label>
                                <select class="form-select">
                                    <option>India</option>
                                    <option>Korea</option>
                                </select>
                            </div>
                            <div class="col-12 mb-3">
                                <label class="form-label">Address</label>
                                <textarea class="form-control"></textarea>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Favourite Color</label>
                                <input type="color" class="form-control form-control-color">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Website</label>
                                <input type="url" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Search</label>
                                <input type="search" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Upload Photo</label>
                                <input type="file" class="form-control">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Registration Time</label>
                                <input type="time" class="form-control">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Month</label>
                                <input type="month" class="form-control">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Week</label>
                                <input type="week" class="form-control">
                            </div>
                            <div class="col-12 mb-3">
                                <label class="form-label">Range of Experience</label>
                                <input type="range"class="form-range">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">Submit</button>
                        <button type="reset" class="btn btn-secondary">Reset</button>
                    </form></div>
            </div></div></div></div>
</body>
</html>
